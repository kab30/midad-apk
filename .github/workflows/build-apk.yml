name: بناء تطبيق مداد

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK is already installed on GitHub's Ubuntu machines (ANDROID_HOME)
      - name: Build APK
        env:
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          test -f www/index.html || { echo "::error::مجلد www غير موجود في المستودع، ارفعه"; exit 1; }
          [ -n "$KEY_PASS" ] || { echo "::error::أضف القيمة السرية KEYSTORE_PASSWORD في Settings > Secrets and variables > Actions"; exit 1; }
          echo "window.MIDAD_BUILD=${{ github.run_number }};" > www/build.js
          npm install --no-audit --no-fund
          CAPV=$(node -p "require('@capacitor/core/package.json').version")
          echo "Capacitor $CAPV" > build-info.txt
          # read-aloud + keep-screen-on plugins: try the release line that matches this Capacitor version first
          OPTIONAL=""
          for v in 7 6 8 5; do
            if npm install --no-audit --no-fund "@capacitor-community/keep-awake@^$v" "@capacitor-community/text-to-speech@^$v" >npm-opt.log 2>&1; then
              OPTIONAL="@capacitor-community/keep-awake @capacitor-community/text-to-speech"; echo "optional plugins: line ^$v" >> build-info.txt; break
            else echo "line ^$v failed: $(grep -m1 -E 'ERESOLVE|ETARGET|peer|notarget' npm-opt.log | cut -c1-160)" >> build-info.txt; fi
          done
          [ -n "$OPTIONAL" ] || echo "::warning::optional plugins skipped"
          # background check for new chapters (notifications)
          if npm install --no-audit --no-fund "@capacitor/background-runner@latest-7" >npm-br.log 2>&1; then OPTIONAL="$OPTIONAL @capacitor/background-runner"; echo "background-runner: ok" >> build-info.txt
          else echo "background-runner failed: $(grep -m1 -E 'ERESOLVE|ETARGET|peer|notarget' npm-br.log | cut -c1-160)" >> build-info.txt; fi
          # opens the downloaded update in Android's installer
          for v in 7 6; do
            if npm install --no-audit --no-fund "@capacitor-community/file-opener@^$v" >npm-fo.log 2>&1; then OPTIONAL="$OPTIONAL @capacitor-community/file-opener"; echo "file-opener: line ^$v" >> build-info.txt; break
            else echo "file-opener ^$v failed: $(grep -m1 -E 'ERESOLVE|ETARGET|peer|notarget' npm-fo.log | cut -c1-160)" >> build-info.txt; fi
          done
          npx cap add android
          RUN=${{ github.run_number }} node tools/patch-android.cjs
          if [ -d assets ]; then
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b1020' --iconBackgroundColorDark '#0b1020' --splashBackgroundColor '#0b1020' --splashBackgroundColorDark '#0b1020' || echo "::warning::icon generation skipped"
          fi
          build(){ npx cap sync android && (cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon); }
          if ! build; then
            [ -n "$OPTIONAL" ] || exit 1
            echo "::warning::retrying without optional plugins"; echo "build with optional plugins failed, built without them" >> build-info.txt
            npm uninstall --no-audit --no-fund $OPTIONAL
            build
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk midad-${{ github.run_number }}.apk
          # make sure the APK is signed with the fixed key, otherwise updates would need a reinstall
          WANT=$(keytool -list -v -keystore keystore/release.p12 -storetype PKCS12 -storepass "$KEY_PASS" | grep -m1 "SHA256:" | awk '{print $2}')
          GOT=$(keytool -printcert -jarfile midad-${{ github.run_number }}.apk | grep -m1 "SHA256:" | awk '{print $2}')
          echo "signing key: $GOT" >> build-info.txt
          [ "$WANT" = "$GOT" ] || { echo "::error::APK signed with a different key ($GOT)"; exit 1; }
          npm ls --depth=0 2>/dev/null | grep -E "capacitor" >> build-info.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: midad-apk
          path: midad-${{ github.run_number }}.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: مداد ${{ github.run_number }}
          files: midad-${{ github.run_number }}.apk
          body_path: build-info.txt
