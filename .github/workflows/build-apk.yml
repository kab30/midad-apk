name: بناء تطبيق مداد

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK is already installed on GitHub's Ubuntu machines (ANDROID_HOME)
      - name: Build APK
        run: |
          set -e
          test -f www/index.html || { echo "::error::مجلد www غير موجود في المستودع، ارفعه"; exit 1; }
          npm install --no-audit --no-fund
          OPTIONAL="@capacitor-community/keep-awake @capacitor-community/text-to-speech"
          npm install --no-audit --no-fund $OPTIONAL || { echo "::warning::optional plugins skipped"; OPTIONAL=""; }
          npx cap add android
          if [ -d assets ]; then
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b1020' --iconBackgroundColorDark '#0b1020' --splashBackgroundColor '#0b1020' --splashBackgroundColorDark '#0b1020' || echo "::warning::icon generation skipped"
          fi
          if [ -f keystore/debug.keystore ]; then mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore; else echo "::warning::لا يوجد keystore، كل نسخة ستحتاج حذف القديمة قبل التثبيت"; fi
          build(){ npx cap sync android && (cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon); }
          if ! build; then
            [ -n "$OPTIONAL" ] || exit 1
            echo "::warning::retrying without optional plugins"
            npm uninstall --no-audit --no-fund $OPTIONAL
            build
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk midad-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: midad-apk
          path: midad-${{ github.run_number }}.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: مداد ${{ github.run_number }}
          files: midad-${{ github.run_number }}.apk
