name: بناء تطبيق مداد

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: bash scripts/build-apk.sh

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk midad-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: midad-apk
          path: midad-${{ github.run_number }}.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: مداد ${{ github.run_number }}
          files: midad-${{ github.run_number }}.apk
